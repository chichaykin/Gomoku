<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Board wood gradient -->
    <radialGradient id="woodGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#dfaa6c" />
      <stop offset="60%" stop-color="#c98a44" />
      <stop offset="100%" stop-color="#9a6026" />
    </radialGradient>
    <!-- Black stone gradient -->
    <radialGradient id="blackStone" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="40%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <!-- White stone gradient -->
    <radialGradient id="whiteStone" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8e8ea" />
      <stop offset="100%" stop-color="#b8b8bc" />
    </radialGradient>
    <!-- Drop shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Goban Board -->
  <rect x="24" y="24" width="464" height="464" rx="36" fill="url(#woodGrad)" filter="url(#boardShadow)" stroke="#744415" stroke-width="4" />

  <!-- Board grid lines -->
  <g stroke="#5c3814" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <!-- Horizontal lines -->
    <line x1="72" y1="96" x2="440" y2="96" />
    <line x1="72" y1="176" x2="440" y2="176" />
    <line x1="72" y1="256" x2="440" y2="256" />
    <line x1="72" y1="336" x2="440" y2="336" />
    <line x1="72" y1="416" x2="440" y2="416" />

    <!-- Vertical lines -->
    <line x1="96" y1="72" x2="96" y2="440" />
    <line x1="176" y1="72" x2="176" y2="440" />
    <line x1="256" y1="72" x2="256" y2="440" />
    <line x1="336" y1="72" x2="336" y2="440" />
    <line x1="416" y1="72" x2="416" y2="440" />
  </g>

  <!-- Hoshi (star points) -->
  <circle cx="176" cy="176" r="5" fill="#44250a" />
  <circle cx="336" cy="176" r="5" fill="#44250a" />
  <circle cx="256" cy="256" r="6" fill="#44250a" />
  <circle cx="176" cy="336" r="5" fill="#44250a" />
  <circle cx="336" cy="336" r="5" fill="#44250a" />

  <!-- Five in a row winning line highlight -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#22c55e" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Five stones in a row along y=256 -->
  <!-- Stone 1: Black -->
  <circle cx="96" cy="256" r="34" fill="url(#blackStone)" filter="url(#shadow)" />
  <!-- Stone 2: Black -->
  <circle cx="176" cy="256" r="34" fill="url(#blackStone)" filter="url(#shadow)" />
  <!-- Stone 3: Black (Center) -->
  <circle cx="256" cy="256" r="34" fill="url(#blackStone)" filter="url(#shadow)" />
  <!-- Stone 4: Black -->
  <circle cx="336" cy="256" r="34" fill="url(#blackStone)" filter="url(#shadow)" />
  <!-- Stone 5: Black -->
  <circle cx="416" cy="256" r="34" fill="url(#blackStone)" filter="url(#shadow)" />

  <!-- A few white stones elsewhere to illustrate the game -->
  <circle cx="256" cy="176" r="34" fill="url(#whiteStone)" filter="url(#shadow)" />
  <circle cx="176" cy="336" r="34" fill="url(#whiteStone)" filter="url(#shadow)" />
  <circle cx="336" cy="336" r="34" fill="url(#whiteStone)" filter="url(#shadow)" />
  <circle cx="256" cy="336" r="34" fill="url(#whiteStone)" filter="url(#shadow)" />
</svg>
